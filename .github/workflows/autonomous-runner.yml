name: Autonomous Sprint Runner

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-sprints:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Claude Runner"
          git config user.email "runner@anthropic.com"

      - name: Run sprint loop
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: |
          VERCEL="https://finance-cockpit-teal.vercel.app"
          CLAUDE="/Users/mac/Library/Application Support/Claude/claude-code/2.1.161/claude.app/Contents/MacOS/claude"
          while true; do
            echo "Checking for pending sprints..."
            RESULT=$(curl -sf --max-time 30 "${VERCEL}/api/sprint/next" -H "x-runner-secret: ${RUNNER_SECRET}")
            echo "Response: ${RESULT}"
            COUNT=$(echo "$RESULT" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
            if [ "$COUNT" -eq "0" ]; then
              echo "No pending sprints. Done."
              break
            fi
            TASK_ID=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
            TASK_TITLE=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['title'])")
            TASK_SPRINT=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['sprint_number'])")
            echo "Sprint #${TASK_SPRINT}: ${TASK_TITLE}"
            echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin)[0]; open('/tmp/task_prompt.txt','w').write(d['prompt']); open('/tmp/task_id.txt','w').write(d['id'])"
            curl -sf --max-time 30 -X POST "${VERCEL}/api/sprint/status" -H "x-runner-secret: ${RUNNER_SECRET}" -H "Content-Type: application/json" -d "{\"id\":\"${TASK_ID}\",\"status\":\"in_progress\"}" > /dev/null
            echo "Running Claude Code for Sprint #${TASK_SPRINT}..."
            if "$CLAUDE" --dangerously-skip-permissions --max-turns 80 < /tmp/task_prompt.txt; then
              BRANCH=$(git branch --show-current)
              if [ "$BRANCH" != "main" ]; then
                git checkout main && git pull origin main
                git merge "$BRANCH" --no-ff -m "Auto-merge: Sprint ${TASK_SPRINT}"
              fi
              git push origin main || true
              curl -sf --max-time 30 -X POST "${VERCEL}/api/sprint/status" -H "x-runner-secret: ${RUNNER_SECRET}" -H "Content-Type: application/json" -d "{\"id\":\"${TASK_ID}\",\"status\":\"done\"}" > /dev/null
              sleep 15
              curl -sf "${VERCEL}/api/telegram/setup" > /dev/null || true
              echo "Sprint #${TASK_SPRINT} deployed!"
              sleep 5
            else
              curl -sf --max-time 30 -X POST "${VERCEL}/api/sprint/status" -H "x-runner-secret: ${RUNNER_SECRET}" -H "Content-Type: application/json" -d "{\"id\":\"${TASK_ID}\",\"status\":\"failed\"}" > /dev/null
              echo "Sprint #${TASK_SPRINT} failed. Stopping."
              exit 1
            fi
          done
