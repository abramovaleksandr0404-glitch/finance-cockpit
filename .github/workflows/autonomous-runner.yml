name: Autonomous Sprint Runner
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  check-and-run:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check sprint_queue and write prompt to file
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          RESULT=$(curl -sf \
            "${SUPABASE_URL}/rest/v1/sprint_queue?status=eq.pending&order=priority.asc,sprint_number.asc&limit=1&select=id,title,prompt" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" 2>/dev/null) || RESULT="[]"
          COUNT=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); print(len(d))" "$RESULT" 2>/dev/null || echo "0")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt "0" ]; then
            python3 -c "
import json, sys
d = json.loads(sys.argv[1])
with open('/tmp/task_id.txt','w') as f: f.write(d[0]['id'])
with open('/tmp/task_title.txt','w') as f: f.write(d[0]['title'])
with open('/tmp/task_prompt.txt','w') as f: f.write(d[0]['prompt'])
" "$RESULT"
            echo "task_id=$(cat /tmp/task_id.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: No tasks
        if: steps.queue.outputs.count == '0'
        run: echo "No pending sprint tasks. System idle."

      - name: Mark in_progress
        if: steps.queue.outputs.count != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sf -X PATCH \
            "${SUPABASE_URL}/rest/v1/sprint_queue?id=eq.$(cat /tmp/task_id.txt)" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status":"in_progress"}'

      - name: Install Claude Code
        if: steps.queue.outputs.count != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        if: steps.queue.outputs.count != '0'
        run: |
          git config user.name "Claude Runner"
          git config user.email "runner@anthropic.com"

      - name: Run Claude Code
        if: steps.queue.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Task: $(cat /tmp/task_title.txt)"
          claude --dangerously-skip-permissions --max-turns 80 < /tmp/task_prompt.txt

      - name: Merge Claude branch to main
        if: steps.queue.outputs.count != '0'
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          echo "Current branch after Claude Code: $CURRENT_BRANCH"
          if [ "$CURRENT_BRANCH" != "main" ]; then
            git checkout main
            git pull origin main
            git merge "$CURRENT_BRANCH" --no-ff -m "Auto-merge sprint from $CURRENT_BRANCH to main"
            git push origin main
            echo "Merged $CURRENT_BRANCH to main"
          else
            git push origin main || true
            echo "Already on main, pushed"
          fi

      - name: Mark done
        if: steps.queue.outputs.count != '0' && success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sf -X PATCH \
            "${SUPABASE_URL}/rest/v1/sprint_queue?id=eq.$(cat /tmp/task_id.txt)" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status":"done"}'

      - name: Mark failed
        if: steps.queue.outputs.count != '0' && failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -sf -X PATCH \
            "${SUPABASE_URL}/rest/v1/sprint_queue?id=eq.$(cat /tmp/task_id.txt)" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed"}'
