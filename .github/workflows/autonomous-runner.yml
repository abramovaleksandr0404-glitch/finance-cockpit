name: Sprint Notifier
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  notify:
    runs-on: self-hosted
    steps:
      - name: Check and notify
        run: |
          R=$(curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/sprint_queue?status=eq.pending&order=priority.asc&limit=1&select=title,sprint_number" -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}")
          CNT=$(echo "$R" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          if [ "$CNT" -gt 0 ]; then
            T=$(echo "$R" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['title'])")
            curl -sf "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=🤖 Готов спринт: $T%0AЗапусти Claude Code командой про sprint_queue"
          fi
